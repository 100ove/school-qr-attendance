
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>بوابة المدرسة - تسجيل الحضور</title>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#f1f5f9;
  font-family:Arial,Tahoma,sans-serif;
  color:#172033;
}

header{
  background:#12345a;
  color:white;
  text-align:center;
  padding:22px 12px;
}

header h2{margin:0 0 8px}

main{
  max-width:650px;
  margin:22px auto;
  padding:0 14px;
}

.panel{
  background:white;
  border:1px solid #dbe3ee;
  border-radius:14px;
  padding:18px;
  margin-bottom:15px;
  text-align:center;
}

#reader{
  width:100%;
  max-width:440px;
  margin:15px auto;
}

button{
  background:#1763a6;
  color:white;
  border:0;
  padding:13px 24px;
  border-radius:9px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

button:disabled{
  opacity:.5;
  cursor:not-allowed;
}

#status{
  padding:15px;
  border-radius:9px;
  background:#f1f5f9;
  margin-top:12px;
  line-height:2;
  overflow-wrap:anywhere;
  text-align:center;
}

#status.success{
  background:#dcfce7;
  color:#166534;
}

#status.error{
  background:#fee2e2;
  color:#991b1b;
}

#status.duplicate{
  background:#fef3c7;
  color:#92400e;
}

.student-name{
  font-size:20px;
  font-weight:bold;
  display:block;
  margin:5px 0;
}

.small{
  color:#64748b;
  font-size:13px;
  line-height:1.8;
}

iframe{
  width:100%;
  height:230px;
  border:0;
  border-radius:10px;
  background:#f8fafc;
}
</style>
</head>

<body>

<header>
  <h2>بوابة المدرسة</h2>
  <div>نظام مسح بطاقات الطلاب وتسجيل الحضور</div>
</header>

<main>

  <section class="panel">
    <h3>مسح بطاقة الطالب QR</h3>

    <div id="reader"></div>

    <button id="startBtn" onclick="startScanner()">
      تشغيل الكاميرا الخلفية
    </button>

    <div id="status">
      اضغط تشغيل الكاميرا ووجّهها نحو بطاقة الطالب.
    </div>

    <p class="small">
      تأكد من السماح باستخدام الكاميرا واتصال الهاتف بالإنترنت.
    </p>
  </section>

  <section class="panel">
    <h3>نتيجة تسجيل الحضور</h3>

    <iframe
      id="attendanceFrame"
      src="https://script.google.com/macros/s/AKfycbyDXed1ELJL8A9AktkNsLCe0VS3yiaPapasHtDQ3Das-CJoGxCVnV5U7JdF1B--B4LYHA/exec?page=scan"
      title="نتيجة تسجيل الحضور">
    </iframe>

  </section>

</main>

<script>
const frame = document.getElementById('attendanceFrame');
const statusBox = document.getElementById('status');
const startBtn = document.getElementById('startBtn');

let scanner = null;
let frameReady = false;
let busy = false;
let lastToken = '';
let lastScanTime = 0;

frame.addEventListener('load', function(){
  frameReady = true;
});

function showStatus(message, type){
  statusBox.className = type || '';
  statusBox.innerHTML = message;
}

function escapeHTML(value){
  return String(value == null ? '' : value).replace(/[&<>"']/g, function(char){
    return {
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#39;'
    }[char];
  });
}

function displayResult(result){

  const student = result.student || {};
  const name = escapeHTML(student.name || 'طالب');
  const grade = escapeHTML(student.grade || '');
  const section = escapeHTML(student.section || '');
  const time = escapeHTML(result.time || '');
  const status = escapeHTML(result.status || '');

  if(result.duplicate){

    showStatus(
      '<strong>هذه البطاقة مسجلة مسبقاً اليوم</strong>' +
      '<span class="student-name">' + name + '</span>' +
      (grade ? 'الصف: ' + grade : '') +
      (section ? ' - الشعبة: ' + section : ''),
      'duplicate'
    );

    return;
  }

  if(result.ok){

    let heading = 'تم تسجيل حضور الطالب بنجاح';

    if(status === 'متأخر'){
      heading = 'تم تسجيل الطالب متأخراً';
    }else if(status === 'غائب'){
      heading = 'تم تسجيل الطالب غائباً';
    }else if(result.message && result.message.indexOf('تحديث') !== -1){
      heading = 'تم تحديث سجل الطالب بنجاح';
    }

    showStatus(
      '<strong>' + heading + '</strong>' +
      '<span class="student-name">' + name + '</span>' +
      (grade ? 'الصف: ' + grade : '') +
      (section ? ' - الشعبة: ' + section : '') +
      (status ? '<br>الحالة: ' + status : '') +
      (time ? '<br>وقت التسجيل: ' + time : ''),
      'success'
    );

    return;
  }

  showStatus(
    escapeHTML(result.message || 'تعذر تسجيل الحضور.'),
    'error'
  );
}

async function onScan(decodedText){

  const token = String(decodedText).trim();
  const now = Date.now();

  if(!token || busy) return;

  if(token === lastToken && now-lastScanTime < 1200){
    return;
  }

  if(!frameReady){
    showStatus(
      'تمت قراءة البطاقة، لكن صفحة تسجيل الحضور لم تكتمل. انتظر قليلاً.',
      'error'
    );
    return;
  }

  busy = true;
  lastToken = token;
  lastScanTime = now;

  showStatus('جارٍ تسجيل البطاقة...', '');

  try{

    const response = await fetch(
      'https://script.google.com/macros/s/AKfycbyDXed1ELJL8A9AktkNsLCe0VS3yiaPapasHtDQ3Das-CJoGxCVnV5U7JdF1B--B4LYHA/exec',
      {
        method:'POST',
        headers:{
          'Content-Type':'text/plain;charset=utf-8'
        },
        body:JSON.stringify({token:token})
      }
    );

    const result = await response.json();

    displayResult(result);

  }catch(error){

    showStatus(
      'تعذر إرسال البطاقة: ' + escapeHTML(error.message),
      'error'
    );

  }finally{

    setTimeout(function(){
      busy = false;
    },300);

  }
}

async function startScanner(){

  if(!window.Html5Qrcode){
    showStatus('تعذر تحميل مكتبة QR. تحقق من الإنترنت.','error');
    return;
  }

  try{

    startBtn.disabled = true;
    showStatus('جارٍ تشغيل الكاميرا الخلفية...','');

    scanner = new Html5Qrcode('reader');

    await scanner.start(
      {facingMode:'environment'},
      {
        fps:15,
        qrbox:{width:240,height:240},
        aspectRatio:1
      },
      onScan,
      function(){}
    );

    showStatus('الكاميرا تعمل. وجّهها نحو QR بطاقة الطالب.','');

  }catch(error){

    startBtn.disabled = false;

    const detail = error && error.message
      ? error.message
      : String(error);

    showStatus(
      'تعذر تشغيل الكاميرا. السبب: ' +
      escapeHTML(error.name || 'Error') + ' - ' +
      escapeHTML(detail),
      'error'
    );

    console.error('Camera error:',error);
  }
}
</script>

</body>
</html>
