
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>بوابة المدرسة - تسجيل الحضور</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#f1f5f9;
  font-family:Arial,Tahoma,sans-serif;
  color:#172033;
}
header{
  background:#12345a;
  color:white;
  text-align:center;
  padding:22px 12px;
}
header h2{margin:0 0 8px}
main{
  max-width:650px;
  margin:22px auto;
  padding:0 14px;
}
.panel{
  background:white;
  border:1px solid #dbe3ee;
  border-radius:14px;
  padding:18px;
  margin-bottom:15px;
  text-align:center;
}
#reader{
  width:100%;
  max-width:440px;
  margin:15px auto;
}
button{
  background:#1763a6;
  color:white;
  border:0;
  padding:13px 24px;
  border-radius:9px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}
button:disabled{
  opacity:.5;
  cursor:not-allowed;
}
#status{
  padding:15px;
  border-radius:9px;
  background:#f1f5f9;
  margin-top:12px;
  line-height:2;
  overflow-wrap:anywhere;
  text-align:center;
}
#status.success{
  background:#dcfce7;
  color:#166534;
}
#status.error{
  background:#fee2e2;
  color:#991b1b;
}
#status.duplicate{
  background:#fef3c7;
  color:#92400e;
}
#status.reading{
  background:#dbeafe;
  color:#1e40af;
}
.student-name{
  font-size:20px;
  font-weight:bold;
  display:block;
  margin:5px 0;
}
.small{
  color:#64748b;
  font-size:13px;
  line-height:1.8;
}
input{
  width:100%;
  max-width:350px;
  padding:12px;
  margin:8px 0;
  border:1px solid #cbd5e1;
  border-radius:9px;
  font-size:16px;
  text-align:center;
}
iframe{
  width:100%;
  height:230px;
  border:0;
  border-radius:10px;
  background:#f8fafc;
}
</style>
</head>
<body>

<header>
  <h2>بوابة المدرسة</h2>
  <div>نظام مسح بطاقات الطلاب وتسجيل الحضور</div>
</header>

<main>
  <section class="panel">
    <h3>مسح بطاقة الطالب QR</h3>

    <label for="recorderName"><b>اسم الحارس أو الموظف المسؤول عن المسح</b></label>
    <br>
    <input
      id="recorderName"
      type="text"
      placeholder="اكتب اسم المسؤول هنا"
      autocomplete="name"
    >

    <div id="reader"></div>

    <button id="startBtn" onclick="startScanner()">
      تشغيل الكاميرا الخلفية
    </button>

    <div id="status">
      اكتب اسم المسؤول ثم اضغط تشغيل الكاميرا.
    </div>

    <p class="small">
      تأكد من السماح باستخدام الكاميرا واتصال الهاتف بالإنترنت.
    </p>
  </section>

  <section class="panel">
    <h3>نتيجة تسجيل الحضور</h3>
    <iframe
      id="attendanceFrame"
      src="https://script.google.com/macros/s/AKfycbyDXed1ELJL8A9AktkNsLCe0VS3yiaPapasHtDQ3Das-CJoGxCVnV5U7JdF1B--B4LYHA/exec?page=scan"
      title="نتيجة تسجيل الحضور">
    </iframe>
  </section>
</main>

<script>
const frame = document.getElementById('attendanceFrame');
const statusBox = document.getElementById('status');
const startBtn = document.getElementById('startBtn');
const recorderInput = document.getElementById('recorderName');

let scanner = null;
let frameReady = false;
let busy = false;
let lastToken = '';
let lastScanTime = 0;
let recorderName = '';

frame.addEventListener('load', function(){
  frameReady = true;
});

function showStatus(message, type){
  statusBox.className = type || '';
  statusBox.innerHTML = message;
}

function escapeHTML(value){
  return String(value == null ? '' : value).replace(/[&<>"']/g, function(char){
    return {
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#39;'
    }[char];
  });
}

function displayResult(result){
  const student = result.student || {};
  const name = escapeHTML(student.name || 'طالب');
  const grade = escapeHTML(student.grade || '');
  const section = escapeHTML(student.section || '');
  const time = escapeHTML(result.time || '');
  const attendanceStatus = escapeHTML(result.status || '');

  if(result.duplicate){
    showStatus(
      '<strong>هذه البطاقة مسجلة مسبقاً اليوم</strong>' +
      '<span class="student-name">' + name + '</span>' +
      (grade ? 'الصف: ' + grade : '') +
      (section ? ' - الشعبة: ' + section : ''),
      'duplicate'
    );
    return;
  }

  if(result.ok){
    let heading = 'تم تسجيل حضور الطالب بنجاح';

    if(result.status === 'متأخر'){
      heading = 'تم تسجيل الطالب متأخراً';
    }else if(result.status === 'غائب'){
      heading = 'تم تسجيل الطالب غائباً';
    }else if(result.message && result.message.indexOf('تحديث') !== -1){
      heading = 'تم تحديث سجل الطالب بنجاح';
    }

    showStatus(
      '<strong>' + heading + '</strong>' +
      '<span class="student-name">' + name + '</span>' +
      (grade ? 'الصف: ' + grade : '') +
      (section ? ' - الشعبة: ' + section : '') +
      (attendanceStatus ? '<br>الحالة: ' + attendanceStatus : '') +
      (time ? '<br>وقت التسجيل: ' + time : ''),
      'success'
    );
    return;
  }

  showStatus(
    escapeHTML(result.message || 'تعذر تسجيل الحضور.'),
    'error'
  );
}

// استقبال نتيجة التسجيل من صفحة Scanner
window.addEventListener('message', function(event){
  if(event.source !== frame.contentWindow) return;

  const data = event.data;

  if(!data || data.type !== 'ATTENDANCE_RESULT') return;

  busy = false;

  if(data.result){
    displayResult(data.result);
  }else{
    showStatus('لم تصل نتيجة تسجيل الحضور.', 'error');
  }
});

async function onScan(decodedText){
  const token = String(decodedText).trim();
  const now = Date.now();

  if(!token || busy) return;

  if(token === lastToken && now - lastScanTime < 1200){
    return;
  }

  if(!frameReady){
    showStatus(
      'صفحة تسجيل الحضور لم تكتمل. انتظر قليلاً ثم حاول مجدداً.',
      'error'
    );
    return;
  }

  busy = true;
  lastToken = token;
  lastScanTime = now;

  showStatus(
    'تمت قراءة البطاقة، جارٍ تسجيل حضور الطالب...',
    'reading'
  );

  try{
    frame.contentWindow.postMessage({
      type:'QR_SCAN',
      token:token,
      recordedBy:recorderName
    }, '*');
  }catch(error){
    busy = false;
    showStatus(
      'تعذر إرسال البطاقة: ' + escapeHTML(error.message),
      'error'
    );
  }
}

async function startScanner(){
  if(!window.Html5Qrcode){
    showStatus('تعذر تحميل مكتبة QR. تحقق من الإنترنت.', 'error');
    return;
  }

  recorderName = recorderInput.value.trim();

  if(!recorderName){
    showStatus('يرجى كتابة اسم الحارس أو الموظف قبل تشغيل الكاميرا.', 'error');
    recorderInput.focus();
    return;
  }

  if(!frameReady){
    showStatus('انتظر حتى تكتمل صفحة تسجيل الحضور ثم حاول مجدداً.', 'error');
    return;
  }

  try{
    startBtn.disabled = true;
    recorderInput.disabled = true;

    showStatus('جارٍ تشغيل الكاميرا الخلفية...', '');

    scanner = new Html5Qrcode('reader');

    await scanner.start(
      {facingMode:'environment'},
      {
        fps:15,
        qrbox:{width:240,height:240},
        aspectRatio:1
      },
      onScan,
      function(){}
    );

    showStatus(
      'الكاميرا تعمل. وجّهها نحو QR بطاقة الطالب.',
      ''
    );

  }catch(error){
    startBtn.disabled = false;
    recorderInput.disabled = false;

    const detail = error && error.message
      ? error.message
      : String(error);

    showStatus(
      'تعذر تشغيل الكاميرا. السبب: ' +
      escapeHTML(error.name || 'Error') + ' - ' +
      escapeHTML(detail),
      'error'
    );

    console.error('Camera error:', error);
  }
}
</script>
</body>
</html>
